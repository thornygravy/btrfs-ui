# Builds the Docker image and publishes it to GitHub's container registry (ghcr.io).
#
#   - every push to the default branch   ->  ghcr.io/<owner>/<repo>:latest
#   - pushing a tag like v1.1.0           ->  :1.1.0 and :1.1 (and :latest)
#   - "Run workflow" button in Actions    ->  same as a push to the default branch
#
# Nothing to configure: the repository name and the login token come from GitHub.
name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read     # read the code
      packages: write    # push to ghcr.io

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # Lets the same build produce an arm64 image (Raspberry Pi and other ARM servers).
      # If the arm64 part ever causes trouble, delete this step and the "platforms:" line below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image name (forced to lowercase, which ghcr.io requires), the tags,
      # and the labels that link the image back to this repository.
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
