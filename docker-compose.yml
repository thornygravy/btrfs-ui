services:
  btrfs-ui:
    build: .
    container_name: btrfs-ui
    restart: unless-stopped
    ports:
      # Localhost only. Change to "8080:8080" to reach it from your LAN, ideally
      # behind a reverse proxy with HTTPS (see README).
      - "127.0.0.1:8080:8080"
    cap_add:
      - SYS_ADMIN            # required for btrfs ioctls (subvolume delete, scrub, balance, ...)
    security_opt:
      - no-new-privileges:true
    environment:
      # Put the password in a .env file next to this one (see .env.example).
      BTRFS_UI_PASSWORD: "${BTRFS_UI_PASSWORD:?Set BTRFS_UI_PASSWORD in a .env file, see .env.example}"
      # BTRFS_UI_READONLY: "1"                # browse only, no changes
      # BTRFS_UI_COOKIE_SECURE: "1"           # set when served over HTTPS
    volumes:
      # Mount each btrfs filesystem at the SAME path as on the host. Mounting the
      # top level (subvolid=5) makes every subvolume reachable.
      - /mnt/btrfs-root:/mnt/btrfs-root
      # Only for the Snapper tab: snapper configs from the host, plus each directory
      # a config points at, at the same path as on the host. For example:
      # - /etc/snapper:/etc/snapper
      # - /mnt/btrfs-root/@data:/mnt/btrfs-root/@data
      # Scrub history. btrfs keeps it in /var/lib/btrfs on the host (OMV's scheduled
      # scrubs write there too), so share that directory rather than an empty volume.
      - /var/lib/btrfs:/var/lib/btrfs
